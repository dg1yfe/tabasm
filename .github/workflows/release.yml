# Build the release archives and attach them to a GitHub Release.
#
# Triggered by pushing a version tag. The tag carries a leading `v` so that
# `v*` matches releases and nothing else: with a calendar version, a bare
# numeric glob would also match any date-shaped tag.
#
# Only actions/checkout is used here, as in ci.yml. The upload is done with
# the `gh` CLI, which is preinstalled on every runner and authenticates with
# the token GitHub already provides, so the release path stays as free of
# third-party dependencies as the crate is.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build. A manual run builds and packages only; it publishes nothing.'
        required: true
        default: master

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.ref || github.ref_name }}

jobs:
  # Only a tag push publishes anything. A manual run is a dry run: it builds
  # and packages every target and checks the result, then stops.
  draft:
    name: open a draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref_name }}' }

      # The tag names the version, and so does Cargo.toml. If they disagree,
      # the download name and the banner the binary prints disagree, which is
      # exactly the sort of drift nobody notices until someone reports a bug
      # against the wrong version. Fail here instead.
      - name: Tag and manifest must agree
        run: |
          manifest=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${TAG#v}" != "$manifest" ]; then
            echo "tag $TAG implies version ${TAG#v}, Cargo.toml says $manifest" >&2
            exit 1
          fi
          echo "version $manifest"

      - name: Create the draft
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --title "tabasm ${TAG#v}" --notes "See the tag annotation and README."
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: ${{ matrix.name }}
    needs: draft
    # Run even when the draft job was skipped, which is what a dry run does.
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every Linux build is statically linked against musl, so it runs on
          # any distribution however old its glibc, and needs no cross libc to
          # build: rust-lld links them all. Nothing here dlopens or looks up
          # users, which is where static musl would otherwise bite.
          #
          # The ARM targets cover the Raspberry Pi range: aarch64 for the
          # 64-bit OS that is now the default on Pi 3 and later, armv7 for the
          # 32-bit OS, and armv6 for the Pi 1 and Zero, which are ARMv6 and
          # cannot run armv7 code.
          - { os: ubuntu-latest,  name: x86_64-linux,    target: x86_64-unknown-linux-musl,      ext: tar.gz, qemu: '' }
          - { os: ubuntu-latest,  name: aarch64-linux,   target: aarch64-unknown-linux-musl,     ext: tar.gz, qemu: qemu-aarch64-static }
          - { os: ubuntu-latest,  name: armv7-linux,     target: armv7-unknown-linux-musleabihf, ext: tar.gz, qemu: qemu-arm-static }
          - { os: ubuntu-latest,  name: armv6-linux,     target: arm-unknown-linux-musleabihf,   ext: tar.gz, qemu: qemu-arm-static }
          - { os: macos-latest,   name: universal-macos, target: '',                             ext: tar.gz, qemu: '' }
          - { os: windows-latest, name: x86_64-windows,  target: '',                             ext: zip,    qemu: '' }
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.inputs.ref || github.ref_name }}' }
      - run: rustup update --no-self-update stable && rustup default stable

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = universal-macos ]; then
            # macos-latest is arm64; add the Intel target and fuse the two so
            # one download serves both, which is what a Mac user expects.
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            cargo build --release --locked --target aarch64-apple-darwin
            cargo build --release --locked --target x86_64-apple-darwin
            mkdir -p out
            for b in tabasm tab1to2; do
              lipo -create -output "out/$b" \
                "target/aarch64-apple-darwin/release/$b" \
                "target/x86_64-apple-darwin/release/$b"
              lipo -info "out/$b"
            done
          elif [ -n "${{ matrix.target }}" ]; then
            rustup target add ${{ matrix.target }}
            # rust-lld links every musl target without a cross toolchain,
            # which is the whole reason the ARM builds need no sysroot. It
            # ships with the toolchain but is not on PATH, so put it there.
            export PATH="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin:$PATH"
            command -v rust-lld >/dev/null || { echo 'rust-lld not found' >&2; exit 1; }
            t=$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')
            export CARGO_TARGET_${t}_LINKER=rust-lld
            cargo build --release --locked --target ${{ matrix.target }}
            mkdir -p out && cp target/${{ matrix.target }}/release/tabasm out/
            cp target/${{ matrix.target }}/release/tab1to2 out/
            file out/tabasm
            # A wrong-architecture or dynamically linked artifact is worse
            # than a failed build, because it ships.
            file out/tabasm | grep -q 'statically linked' \
              || { echo 'not statically linked' >&2; exit 1; }
          else
            cargo build --release --locked
            mkdir -p out && cp target/release/tabasm.exe target/release/tab1to2.exe out/
          fi

      # A release binary that has not been tested is a guess. The suites are
      # fast; run them on what is about to ship. A cross-built binary cannot
      # run here, so those are exercised under qemu after packaging instead.
      - name: Test
        if: matrix.qemu == ''
        run: cargo test --release --locked

      - name: Package
        shell: bash
        run: |
          ver=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          dir="tabasm-$ver-${{ matrix.name }}"
          mkdir -p "$dir"
          cp out/* "$dir"/
          # The tables are not optional extras: without them the binary knows
          # no instruction set and cannot assemble anything at all.
          cp -r tables "$dir"/
          cp README.md LICENSE NOTICE "$dir"/
          mkdir -p "$dir/doc"
          cp doc/table-format.md doc/table-format-legacy.md doc/tabasm.1 "$dir/doc"/

          # Prove the packaged binary works from inside the package, rather
          # than trusting that the copy went right. A cross-built one runs
          # under qemu, which is enough to catch a broken build or a missing
          # table; it is not a substitute for the suites.
          printf '        .org 0\n        nop\n        .end\n' > "$dir/probe.asm"
          if [ -n "${{ matrix.qemu }}" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
            ( cd "$dir" && ${{ matrix.qemu }} ./tabasm --cpu z80 probe.asm probe.obj probe.lst )
          else
            ( cd "$dir" && TASMTABS=tables ./tabasm* --cpu z80 probe.asm probe.obj probe.lst )
          fi
          test -s "$dir/probe.obj" || { echo 'probe produced no object' >&2; exit 1; }
          rm -f "$dir"/probe.*

          if [ "${{ matrix.ext }}" = zip ]; then
            7z a -tzip "$dir.zip" "$dir" >/dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
          ls -l "$dir".*

      - name: Upload to the draft
        if: github.event_name == 'push'
        shell: bash
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber tabasm-*.tar.gz tabasm-*.zip
        env:
          GH_TOKEN: ${{ github.token }}

      # A dry run keeps the archives as workflow artifacts instead, so what
      # was built can be downloaded and looked at.
      - name: Keep the archive (dry run)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            tabasm-*.tar.gz
            tabasm-*.zip
          if-no-files-found: error

  publish:
    name: checksums and publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checksums over what was actually uploaded
        run: |
          mkdir dl && cd dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'tabasm-*'
          sha256sum tabasm-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
