[package]
name    = "tabasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Clean-room reimplementation of the TASM table-driven cross-assembler"

[[bin]]
name = "tabasm"
path = "src/main.rs"

# Converts a legacy table to the current format. Shipped because the loader
# still reads legacy tables, so a user may hold some.
[[bin]]
name = "tab1to2"
path = "src/bin/tab1to2.rs"

# No dependencies, by intent: the assembler is pure std. Nothing here descends
# from the original implementation -- see AGENTS.md.

[profile.release]
opt-level = 2
# Deliberately NOT panic = "abort". testing/robustness.rs treats an abort as a
# crash, so the binary must unwind rather than SIGABRT if a panic ever escapes.
panic = "unwind"

# The suites live in testing/ rather than cargo's default tests/ directory, so
# they do not collide with the development harness of the same name.
[[test]]
name = "golden"
path = "testing/golden.rs"
harness = true

[[test]]
name = "conformance"
path = "testing/conformance.rs"
harness = true

[[test]]
name = "robustness"
path = "testing/robustness.rs"
harness = true
